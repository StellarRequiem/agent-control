name: ci

# Offline gates only — live ARM/TCC proofs stay operator-machine hold-tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-proof:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install "mcp-assure>=0.3.2" pytest
      - name: Unit tests (shell gate)
        run: python -m pytest -q tests
      - name: Offline proof board
        run: python smoke/proof_suite.py --offline
      - name: Claim ladder present
        run: test -f docs/CLAIM_LADDER.md
