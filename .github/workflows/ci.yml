name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cannot-bypass:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mcp-assure (the gate the planes route through) + pytest
        run: |
          python -m pip install -U pip
          pip install "mcp-assure==0.3.2" pytest
      - name: Cannot-bypass smoke (offline gate proofs, no bridge)
        run: python smoke/cannot_bypass_planes.py --offline
      - name: Gated shell.exec proof (interpreter-free, path-confined)
        run: pytest tests/ -q
      - name: Offline proof board (gates only; no live freeze/bridges)
        run: python smoke/proof_suite.py --offline
